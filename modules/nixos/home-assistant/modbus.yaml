      name: "ESS 1 - BMS1 Force Charge Enable"
      unique_id: "ess_1_bms1_force_charge_enable"
      address: 37636
      write_type: holding
      command_on: 1
      command_off: 0
      verify:
        input_type: holding
        address: 37636
        state_on: 1
        state_off: 0
        delay: 0

  sensors:
    # ---- Device meta (1 hour) ----
    - slave: 247
      name: "ESS 1 - Device Model Name"
      unique_id: "ess_1_device_model_name"
      address: 30000
      input_type: input
