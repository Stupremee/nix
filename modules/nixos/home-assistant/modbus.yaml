- name: "ESS 1"
  type: tcp
  host: ASP-E2-AS22AE30465G021.local
  port: 502

  binary_sensors:
    - slave: 247
      name: "ESS 1 - BMS1 Online"
      unique_id: "ess_1_bms1_online"
      address: 37002
      input_type: input
      device_class: connectivity
      scan_interval: 10

    - slave: 247
      name: "ESS 1 - Meter1 Connected"
